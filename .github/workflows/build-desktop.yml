name: Build Windows Desktop Installer

on:
  push:
    branches:
      - main
    paths:
      - 'src-tauri/**'
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.js'
      - 'index.html'
      - '.github/workflows/build-desktop.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build SMS Windows Installer (.exe)
    runs-on: windows-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Rust Stable (MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Node Dependencies
        run: npm ci

      - name: Build Web Frontend
        run: npm run build

      - name: Build Tauri Desktop NSIS Installer
        run: npx tauri build --ci --bundles nsis --verbose

      - name: Upload Windows Installer (.exe)
        uses: actions/upload-artifact@v4
        with:
          name: SMS-Student-Management-System-Installer
          path: src-tauri/target/**/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Publish GitHub Release (Direct Public Download)
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0
          name: "SMS — Student Management System (Windows Desktop Release)"
          body: |
            ### SMS — Student Management System (Windows Desktop Installer)

            Direct download link for the latest Windows setup installer:
            - **Developer:** Dhruv Shah
            - **Email:** dushah2007@gmail.com
            - **WhatsApp & Phone:** +91 8866039007
          files: |
            src-tauri/target/**/bundle/nsis/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
